<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Caisse Bar Maxime</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .product { border: 1px solid #ccc; padding: 10px; margin: 10px; width: 220px; display: inline-block; vertical-align: top; cursor: pointer; }
    .product.out { opacity: 0.45; }
    .product.stock-only { cursor: default; background: #fafafa; }
    .stock-controls { display: flex; gap: 5px; align-items: center; margin-top: 6px; }
    .stock-controls input { width: 75px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    .input-row { margin-top: 20px; }
    .input-row input, .input-row button { padding: 8px; font-size: 16px; margin: 4px; }
    #change-display { margin-top: 10px; font-weight: bold; }
    #history { margin-top: 40px; }
  </style>
</head>
<body>
  <h1>Caisse du Bar (Cash)</h1>
  <div id="products"></div>

  <div id="cart">
    <h2>Facture</h2>
    <table>
      <thead>
        <tr><th>Produit</th><th>Qté</th><th>Prix</th><th>Total</th><th>Action</th></tr>
      </thead>
      <tbody id="cart-body"></tbody>
      <tfoot>
        <tr><td colspan="4">Total</td><td id="total">0.00 $</td></tr>
      </tfoot>
    </table>
    <div class="input-row">
      <label for="received">Argent reçu : </label>
      <input type="number" id="received" placeholder="ex: 50">
      <button onclick="calculateChange()">Calculer le change</button>
      <button onclick="finaliserFacture()">Finaliser la facture</button>
      <button onclick="resetCart()">Vider la facture</button>
    </div>
    <div id="change-display"></div>
  </div>

  <div id="history">
    <h2>Historique des ventes</h2>
    <button onclick="exportCSV()">Exporter CSV</button>
    <button onclick="resetData()">Réinitialiser les ventes</button>
    <ul id="sale-log"></ul>
  </div>

  <a id="download-link" style="display:none"></a>

<script>
const savedStock = JSON.parse(localStorage.getItem('stock') || '{}');
const savedSold = JSON.parse(localStorage.getItem('sold') || '{}');
let history = JSON.parse(localStorage.getItem('history') || '[]');
let cart = [];

const products = [
  { name: 'Corona', price: 4.00 },
  { name: 'Bud', price: 3.50 },
  { name: 'Ultra', price: 3.50 },
  { name: 'Bud Light', price: 3.50 },
  { name: 'Corona Sans Alcool', price: 3.00 },
  { name: 'Pepsi', price: 2.00 },
  { name: '7up', price: 2.00 },
  { name: 'Gatorade', price: 2.50 },
  { name: 'Chip', price: 1.75 },
  { name: 'Chocolat', price: 1.75 },
  { name: 'Eau', price: 1.50 },
  { name: 'Fromage', price: 2.50 },
  { name: 'Rhum', price: 0.00, stockOnly: true },
  { name: '6 Corona pour 22$', price: 22.00, recipe: [{ name: 'Corona', qty: 6 }] },
  { name: 'Rhum/Pepsi', price: 4.50, recipe: [{ name: 'Rhum', qty: 1 }, { name: 'Pepsi', qty: 0.5 }], doublePrice: 6.00, doubleRecipe: [{ name: 'Rhum', qty: 2 }, { name: 'Pepsi', qty: 0.5 }] },
  { name: 'Rhum/7up', price: 4.50, recipe: [{ name: 'Rhum', qty: 1 }, { name: '7up', qty: 0.5 }], doublePrice: 6.00, doubleRecipe: [{ name: 'Rhum', qty: 2 }, { name: '7up', qty: 0.5 }] }
];

products.forEach(p => {
  p.stock = savedStock[p.name] ?? 10;
  p.sold = savedSold[p.name] ?? 0;
});

function renderProducts() {
  const container = document.getElementById('products');
  container.innerHTML = '';

  products.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'product' + (item.stock <= 0 ? ' out' : '') + (item.stockOnly ? ' stock-only' : '');

    div.innerHTML = `
      <strong>${item.name}</strong><br>
      ${item.price.toFixed(2)} $<br>
      Stock: <span>${item.stock}</span><br>
      Vendus: <span>${item.sold}</span>
      <div class="stock-controls">
        <input type="number" id="input-${index}" placeholder="Ajout rapide" onclick="event.stopPropagation();">
        <button onclick="event.stopPropagation(); updateStock(${index}, true)">+</button>
        <button onclick="event.stopPropagation(); updateStock(${index}, false)">-</button>
      </div>
    `;

    if (!item.stockOnly) div.onclick = () => addToCart(index);
    container.appendChild(div);
  });
}

function updateStock(index, isAdd) {
  const input = document.getElementById(`input-${index}`);
  const value = parseFloat(input.value);
  const amount = (!isNaN(value) && value > 0) ? value : 1;

  products[index].stock += isAdd ? amount : -amount;
  if (products[index].stock < 0) products[index].stock = 0;

  input.value = '';
  saveStock();
  renderProducts();
}

function addToCart(index) {
  const item = products[index];

  let useDouble = false;

  if (item.name === 'Rhum/Pepsi' || item.name === 'Rhum/7up') {
    useDouble = confirm('OK = Double 2 oz (6$)
Annuler = Régulier 1 oz (4.50$)');
  }

  if (item.recipe) {
    const activeRecipe = useDouble && item.doubleRecipe ? item.doubleRecipe : item.recipe;

    for (const part of activeRecipe) {
      const stockItem = products.find(p => p.name === part.name);
      if (!stockItem || stockItem.stock < part.qty) {
        alert('Stock insuffisant pour ' + part.name);
        return;
      }
    }
    for (const part of activeRecipe) {
      const stockItem = products.find(p => p.name === part.name);
      stockItem.stock -= part.qty;
    }
  } else {
    if (item.stock <= 0) return;
    item.stock -= 1;
  }

  item.sold += 1;

  const finalPrice = useDouble && item.doublePrice ? item.doublePrice : item.price;
  const finalName = useDouble ? item.name + ' DOUBLE' : item.name;

  const existing = cart.find(p => p.name === finalName);

  if (existing) existing.qty += 1;
  else cart.push({ name: finalName, price: finalPrice, qty: 1 });

  saveStock();
  saveSold();
  renderProducts();
  renderCart();
}

function renderCart() {
  const tbody = document.getElementById('cart-body');
  tbody.innerHTML = '';
  let total = 0;

  cart.forEach((item, i) => {
    const lineTotal = item.qty * item.price;
    total += lineTotal;
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${item.name}</td>
      <td>${item.qty}</td>
      <td>${item.price.toFixed(2)} $</td>
      <td>${lineTotal.toFixed(2)} $</td>
      <td><button onclick="removeLine(${i})">Supprimer</button></td>
    `;
    tbody.appendChild(row);
  });
  document.getElementById('total').innerText = total.toFixed(2) + ' $';
}

function removeLine(i) {
  cart.splice(i, 1);
  renderCart();
}

function calculateChange() {
  const received = parseFloat(document.getElementById('received').value);
  const total = cart.reduce((sum, item) => sum + item.qty * item.price, 0);
  if (isNaN(received)) {
    document.getElementById('change-display').innerText = 'Entre un montant reçu.';
    return;
  }
  const change = received - total;
  document.getElementById('change-display').innerText = change >= 0 ? `Change : ${change.toFixed(2)} $` : 'Montant insuffisant';
}

function finaliserFacture() {
  if (cart.length === 0) return;
  const now = new Date().toLocaleString();
  const ligne = `${now} – ` + cart.map(p => `${p.name} x${p.qty} = ${(p.qty * p.price).toFixed(2)} $`).join(', ');
  history.push(ligne);
  localStorage.setItem('history', JSON.stringify(history));
  cart = [];
  renderCart();
  updateHistory();
  document.getElementById('received').value = '';
  document.getElementById('change-display').innerText = '';
}

function resetCart() {
  cart = [];
  renderCart();
  document.getElementById('received').value = '';
  document.getElementById('change-display').innerText = '';
}

function updateHistory() {
  const ul = document.getElementById('sale-log');
  ul.innerHTML = '';
  history.forEach(entry => {
    const li = document.createElement('li');
    li.innerText = entry;
    ul.appendChild(li);
  });
}

function resetData() {
  if (confirm('Réinitialiser seulement l’historique et les compteurs vendus ?')) {
    localStorage.removeItem('history');
    localStorage.removeItem('sold');
    history = [];
    products.forEach(p => p.sold = 0);
    saveSold();
    updateHistory();
    renderProducts();
  }
}

function exportCSV() {
  let csv = 'Date,Article,Qté,Total\n';
  history.forEach(line => csv += line.replace(/ – | = |\$/g, ',').replace(/, /g, ',') + '\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const link = document.getElementById('download-link');
  link.href = URL.createObjectURL(blob);
  link.download = 'ventes.csv';
  link.click();
}

function saveStock() {
  const data = {};
  products.forEach(p => data[p.name] = p.stock);
  localStorage.setItem('stock', JSON.stringify(data));
}

function saveSold() {
  const data = {};
  products.forEach(p => data[p.name] = p.sold);
  localStorage.setItem('sold', JSON.stringify(data));
}

window.onload = () => {
  updateHistory();
  renderProducts();
  renderCart();
};
</script>
</body>
</html>
